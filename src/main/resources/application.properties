spring.application.name=pos-system
server.port=8080
#Tomcat started on port 8080 ,spring boot port >1023 (0<ports<65535)

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/point_of_sell?createDatabaseIfNotExist=true
#localhost:3306 => local database link ,point_of_sell=>database name
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
#update=>update database each run time /create =>create new database each run time withing delete the exist database,...
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

#for swagger
spring.mvc.pathmatch.matching-strategy=ant_path_matcher